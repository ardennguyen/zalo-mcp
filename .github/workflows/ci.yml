name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - run: node mcp-server.js --help 2>&1 || true  # sanity check server loads
