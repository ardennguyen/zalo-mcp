name: CI

# Every branch and every pull request, whatever its base.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 26 is the LTS line every machine of ours runs; 22 is the floor `engines` still promises users.
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The same npm the publish workflow uses (needs Node ^22.22.2, ^24.15.0 or >=26; `22` and `26` resolve to the
      # latest of each line).
      - run: npm install -g npm@^12.2.0

      - run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - run: npm test
      - run: node mcp-server.js --help 2>&1 || true  # sanity check server loads
