name: CI

on:
  push:
    branches: [main, v2.0-dev, v2.0.0, v1.1.0]
  pull_request:
    branches: [main, v2.0-dev, v2.0.0, v1.1.0]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - run: npm test
      - run: node mcp-server.js --help 2>&1 || true  # sanity check server loads
