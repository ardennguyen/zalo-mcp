name: CI

# Every branch and every pull request, whatever its base.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same npm the publish workflow uses (needs Node ^22.22.2; `22` resolves to the latest 22.x).
      - run: npm install -g npm@^12.2.0

      - run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci
      - run: npm test
      - run: node mcp-server.js --help 2>&1 || true  # sanity check server loads
